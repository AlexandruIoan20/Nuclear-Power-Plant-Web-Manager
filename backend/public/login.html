<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <p>Se inițializează sistemul de autentificare...</p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("app-container");

            const attachLoginHandler = () => {
                const loginForm = container.querySelector('#loginForm');
                if (!loginForm) return;

                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const submitButton = loginForm.querySelector('input[type="submit"]');
                    if (submitButton) submitButton.disabled = true;

                    try {
                        const formData = new FormData(loginForm);

                        const resp = await fetch('/login', {
                            method: 'POST',
                            body: formData,
                            credentials: 'include',
                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            }
                        });

                        const text = await resp.text();

                        if (resp.redirected || resp.url.includes('/dashboard')) {
                            window.location.href = '/dashboard.html';
                            return;
                        }

                        container.innerHTML = text;
                        attachLoginHandler();
                    } catch (err) {
                        console.error('Login submit failed', err);
                        container.innerHTML = "<p style='color:red;'>Eroare la conectare — verifica serverul.</p>";
                    } finally {
                        if (submitButton) submitButton.disabled = false;
                    }
                }, { once: true });
            };

            fetch("http://localhost:8081/login")
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Eroare de server: ${response.status}`);
                    }

                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;
                    attachLoginHandler();
                })
                .catch(error => {
                    console.error("Eroare la încărcarea formularului de login:", error);
                    container.innerHTML = "<p style='color: red;'>Eroare critică: Nu s-a putut contacta serverul central.</p>";
                });
        });
    </script>
</body>
</html>
