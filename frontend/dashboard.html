<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <div id="app-container" class="panel">
            <p class="inline-status">Se încarcă dashboard-ul...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app-container');

            fetch('http://localhost:8081/api/user/status', { credentials: 'include' })
                .then((response) => {
                    if (response.status === 401) {
                        window.location.href = 'http://localhost:8081/login.html';
                        return null;
                    }

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return fetch('http://localhost:8081/dashboard', { credentials: 'include' });
                })
                .then((response) => {
                    if (!response) return null;
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.text();
                })
                .then((html) => {
                    if (html) container.innerHTML = html;
                })
                .catch((error) => {
                    container.innerHTML =
                        `<p style="color: var(--danger);">Nu am putut încărca dashboard-ul: ${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
