<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-shell">
        <main id="app-container" class="panel">
            <p class="inline-status">Se încarcă dashboard-ul...</p>
        </main>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value).replace(/[&<>"]|'/g, (character) => {
                const escapeMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };

                return escapeMap[character] || character;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app-container');

            fetch('http://localhost:8081/api/user/status', { credentials: 'include' })
                .then((response) => {
                    if (response.status === 401) {
                        window.location.href = 'login.html';
                        return null;
                    }

                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then((result) => {
                    if (!result) return;

                    const user = result.data;
                    const username = escapeHtml(user.username);
                    const email = escapeHtml(user.email);
                    const role = escapeHtml(user.role);

                    container.innerHTML = `
                        <header class="topbar">
                            <div class="brand">
                                <strong>Nuclear Plant Control</strong>
                                <span>Overview operațional pentru centralele nucleare</span>
                            </div>
                            <nav class="nav-links" aria-label="Navigare principală">
                                <a href="start.html">Start</a>
                                <a href="dashboard.html" class="active">Dashboard</a>
                                <a href="http://localhost:8081/logout">Logout</a>
                            </nav>
                        </header>

                        <section>
                            <p class="eyebrow">CONTROL PANEL / OVERVIEW</p>
                            <h1>Bun venit, ${username}!</h1>
                            <p>Ești conectat cu succes. Aici pornește navigarea către notificări, aprobări, harta centralelor și lista de unități.</p>

                            <div class="status-card session-card">
                                <p class="inline-status">USER SESSION ACTIVE</p>
                                <h2>${username}</h2>
                                <p class="session-meta">${email} · Rol: ${role}</p>
                            </div>

                            <div class="stats" aria-label="Status utilizator">
                                <div class="stat"><strong>${role}</strong><span>Rol utilizator</span></div>
                                <div class="stat"><strong>${email}</strong><span>Email conectat</span></div>
                                <div class="stat"><strong>ONLINE</strong><span>Status sesiune</span></div>
                            </div>

                            <div class="hero-actions actions-spaced">
                                <a class="button" href="notifications.html">Notificări</a>
                                <a class="button" href="approvals.html">Aprobări</a>
                                <a class="button" href="map.html">Harta centralelor</a>
                                <a class="button secondary" href="power-plants/list.html">Lista centralelor</a>
                                <a class="button secondary" href="http://localhost:8081/logout">Deconectare</a>
                            </div>
                        </section>
                    `;
                })
                .catch((error) => {
                    container.innerHTML = `<p class="error-banner">Nu am putut încărca dashboard-ul: ${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
