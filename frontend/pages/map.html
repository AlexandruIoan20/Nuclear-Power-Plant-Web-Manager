<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Hartă</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../modules/config/globals.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .map-layout { display: flex; gap: 24px; align-items: flex-start; }
        .map-shell { flex: 1; }
        .map-sidebar { width: 320px; flex-shrink: 0; }
        .map-list { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
        .map-item { padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
        .map-item h3 { margin: 0 0 6px; font-size: 1rem; }
        .map-item-meta { font-size: 0.85rem; color: var(--muted); }
        .map-item-actions { margin-top: 8px; }
        .map-empty { padding: 24px; text-align: center; color: var(--muted); }
        .map-status { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <strong>Nuclear Plant Control</strong>
                <span>Hartă centrale</span>
            </div>
            <nav class="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="notifications.html">Notificări</a>
                <a href="approvals.html">Aprobări</a>
                <a href="map.html" class="active">Hartă</a>
                <a href="power-plants/list.html">Lista centralelor</a>
            </nav>
        </header>
        <main class="map-layout">
            <section class="panel map-shell">
                
                <h1>Centrale nucleare</h1>
                <div id="plants-map" class="leaflet-map" style="height:520px"></div>
                <p id="map-status" class="map-status"></p>
            </section>

            <aside class="panel map-sidebar">
                <div id="map-list" class="map-list"></div>
            </aside>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="../plant-map.js"></script>
    <script>
        function escapeHtml(value) {
            return String(value).replace(/[&<>"]|'/g, (character) => {
                const escapeMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return escapeMap[character] || character;
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const statusEl = document.getElementById('map-status');
            const listEl = document.getElementById('map-list');

            try {
                const session = await fetch(API_BASE + '/user/status', { credentials: 'include' });
                if (session.status === 401) {
                    window.location.href = 'login.html';
                    return;
                }

                const res = await fetch(API_BASE + '/power-plants/map-data');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const payload = await res.json();
                const plants = Array.isArray(payload.data) ? payload.data : [];

                if (plants.length === 0) {
                    statusEl.textContent = 'Nu există centrale cu coordonate.';
                    listEl.innerHTML = '<div class="map-empty">Niciun rezultat.</div>';
                    return;
                }

                listEl.innerHTML = plants.map(p => `
                    <article class="map-item">
                        <h3>${escapeHtml(p.name || 'Centrală')}</h3>
                        <div class="map-item-meta">${escapeHtml(p.country || '')}</div>
                        <div class="map-item-meta">${escapeHtml(p.coordinates_label || '')}</div>
                        <div class="map-item-actions"><a class="button secondary" href="${escapeHtml(p.edit_url)}">Editează</a></div>
                    </article>
                `).join('');

                window.PlantMap.setupPlantsOverviewMap({ mapId: 'plants-map', plants });
                statusEl.textContent = `${plants.filter(p => p.has_coordinates).length} centrală(e) afișată(e)`;
            } catch (err) {
                console.error('Map load error', err);
                statusEl.textContent = 'Eroare la încărcarea hărții.';
                listEl.innerHTML = '<div class="map-empty">Eroare la încărcare.</div>';
            }
        });
    </script>
</body>
</html>
