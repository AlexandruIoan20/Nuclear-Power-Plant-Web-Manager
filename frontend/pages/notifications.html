<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Notificări</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <script src="../modules/config/globals.js"></script>
    <style>
        .notification-card {
            background-color: var(--surface, #1e1e1e);
            border-left: 4px solid var(--border);
            padding: 20px;
            margin-bottom: 16px;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .notification-card.scram { border-color: var(--danger, #dc3545); }
        .notification-card.alarm { border-color: #ffc107; }
        .notification-card.alert { border-color: #fd7e14; }
        .notification-card.info { border-color: var(--primary, #0d6efd); }
        
        .notification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notification-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text);
        }
        .notification-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }
        .notification-body {
            color: #ccc;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <div class="page-shell">
        <div id="main-navbar"></div>
        <main class="panel">
            <p class="eyebrow">SYSTEM LOGS</p>
            <h1>Centrul de Notificări</h1>
            <p>Istoricul consolidat al alertelor de la senzori și al solicitărilor administrative.</p>

            <div id="loading-indicator" class="inline-status" style="margin-top: 20px;">
                Se interoghează serverul...
            </div>
            
            <div id="error-message" style="color: var(--danger); display: none; margin-top: 20px;"></div>

            <div id="notifications-container" style="margin-top: 32px;">
            </div>

        </main>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value).replace(/[&<>"]|'/g, (character) => {
                const escapeMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };
                return escapeMap[character] || character;
            });
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("notifications-container");
            const loadingIndicator = document.getElementById("loading-indicator");
            const errorMessage = document.getElementById("error-message");

            try {
                const response = await fetch(API_BASE + "/notifications", {
                    credentials: 'include'
                });
                
                if (response.status === 401) {
                    window.location.href = "login.html";
                    return;
                }
                
               
                const result = await response.json();

                if (!response.ok) {
                    
                    throw new Error(result.message || `Eroare HTTP ${response.status}`);
                }

                loadingIndicator.style.display = "none";

                if (result.status === 'success' && Array.isArray(result.data)) {
                    if (result.data.length === 0) {
                        container.innerHTML = `<p style="color: var(--text-muted); text-align: center;">Nu există nicio notificare înregistrată în sistem.</p>`;
                        return;
                    }

                    result.data.forEach(notification => {
                        const card = document.createElement("div");
                        const severityClass = notification.severity.toLowerCase();
                        card.className = `notification-card ${severityClass}`;

                        card.innerHTML = `
                            <div class="notification-header">
                                <span class="notification-title">${escapeHtml(notification.title)}</span>
                                <span class="notification-meta">${escapeHtml(notification.date)}</span>
                            </div>
                            <div class="notification-body">
                                ${escapeHtml(notification.message)}
                            </div>
                            <div class="notification-meta" style="margin-top: 8px;">
                                TYPE: ${escapeHtml(notification.type)} | ROLE CLEARANCE: ${escapeHtml(notification.target_role)}
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            } catch (error) {
                loadingIndicator.style.display = "none";
                errorMessage.style.display = "block";
                errorMessage.innerHTML = `<strong>Eroare comunicație:</strong> ${escapeHtml(error.message)}`;
            console.error("Eroare fetch notificări:", error);
            }
        });
    </script>

    <script type="module" src="../modules/ui/navbar.js"></script>
</body>
</html>
