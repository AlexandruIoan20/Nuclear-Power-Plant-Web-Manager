<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date de Bază Centrală</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="page-shell">
        <div id="form-header"></div>
        <main class="form-panel login-card" style="margin: 0 auto;">
            <h2 id="form-title">Date de Bază</h2>

            <form id="basics-form">
                <div class="field-grid">
                    <div class="field">
                        <label for="capacity">Capacitate planificată (MW):</label>
                        <input type="number" id="capacity" name="capacity" step="0.01" />
                    </div>

                    <div class="field">
                        <label for="constructionDurationYears">Durată construcție (ani):</label>
                        <input type="number" id="constructionDurationYears" name="constructionDurationYears" step="1" />
                    </div>

                    <div class="field">
                        <label for="description">Descriere:</label>
                        <textarea id="description" name="description" rows="4" placeholder="Introduceți detalii generale..."></textarea>
                    </div>
                </div>

                <div class="card-actions">
                    <button type="submit" class="button" id="submit-btn">Salvează</button>
                </div>

                <div id="status-message" style="margin-top: 18px;"></div>
            </form> 
        </main>
    </div>

    <script type="module" src="../../modules/ui/form-header/formHeader.js"></script>
    <script type="module" src="../../modules/pages/power-plants/basics.js"></script>
</body>
</html>
