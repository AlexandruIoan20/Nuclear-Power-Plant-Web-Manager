<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creare Centrală Electrică</title>
    <link rel="stylesheet" href="../../style.css">
</head>
<body>
    <div class="page-shell">
        <main class="form-panel login-card" style="margin: 0 auto;">
            <h1>Detalii Centrală Electrică</h1>
            <p>Introduceți datele pentru noua facilitate energetică în sistemul central.</p>

            <form id="plant-form">
                <div class="field-grid">
                    <div class="field">
                        <label for="name">Nume:</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <div class="field">
                        <label for="country">Țară:</label>
                        <input type="text" id="country" name="country" list="country-list" placeholder="Tastează pentru a căuta..." required />
                        <datalist id="country-list"></datalist>
                    </div>

                    <div class="field">
                        <label for="latitude">Latitudine:</label>
                        <input type="number" id="latitude" name="latitude" step="0.01" min="-90" max="90" required />
                    </div>

                    <div class="field">
                        <label for="longitude">Longitudine:</label>
                        <input type="number" id="longitude" name="longitude" step="0.01" min="-180" max="180" required />
                    </div>
                </div>

                <div class="card-actions">
                    <button type="submit" class="button">Salvează</button>
                </div>

                <div id="status-message" style="margin-top: 18px;"></div>
            </form>
        </main>
    </div>

    <script type="module" src="../../modules/pages/plant-create.js"></script>
</body>
</html>
