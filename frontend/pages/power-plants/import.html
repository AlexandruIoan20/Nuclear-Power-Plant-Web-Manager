<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Import Plants</title>
    <link rel="stylesheet" href="../../style.css">
    <script src="../../modules/config/globals.js"></script>
    <style>
        .import-panel { max-width: 640px; margin: 0 auto; }
        .import-panel p { margin-bottom: 16px; color: var(--text-muted); }
        .import-panel .field { margin-bottom: 16px; }
        .import-panel .preview { margin-bottom: 16px; }
        .import-panel .preview h3 { margin-bottom: 8px; }
        .import-panel .preview ul { margin-bottom: 16px; }
        .import-panel .result { margin-bottom: 12px; }
        .import-panel .result-links { margin-top: 8px; }
        .import-panel .result-links a { display: block; }
        .import-panel .error { color: var(--danger); margin-top: 12px; }
        .import-panel .button { padding: 6px 14px; font-size: 0.82rem; }
        .import-panel #import-status { margin-left: 12px; }
    </style>
</head>
<body>
    <div class="page-shell">
        <div id="main-navbar"></div>

        <div class="topbar" style="margin-bottom:24px;">
            <div class="brand">
                <strong>Import Plants</strong>
            </div>
            <div class="nav-links">
                <a class="button secondary" href="/pages/power-plants/list.html">Back</a>
            </div>
        </div>

        <div class="panel import-panel">
            <h2 style="margin-bottom: 16px;">Upload JSON File</h2>
            <p>Select a JSON file exported from the system.</p>

            <div class="field">
                <label for="file-input">Choose JSON file</label>
                <input type="file" id="file-input" accept=".json" />
            </div>

            <div class="preview" id="preview-area" style="display: none;">
                <h3>Plants to import:</h3>
                <ul id="plant-preview-list"></ul>
                <button class="button" id="btn-confirm-import" disabled>Confirm Import</button>
                <span id="import-status"></span>
            </div>

            <div class="result" id="result-area" style="display: none;">
                <h3>Import Result</h3>
                <div id="result-message"></div>
                <div class="result-links" id="result-links"></div>
                <button class="button secondary" id="btn-import-another" style="margin-top: 12px;">Import Another</button>
            </div>

            <div class="error" id="error-area" style="display: none;"></div>
        </div>
    </div>

    <script type="module" src="../../modules/ui/navbar.js"></script>
    <script type="module" src="../../modules/pages/power-plants/import.js"></script>
</body>
</html>
