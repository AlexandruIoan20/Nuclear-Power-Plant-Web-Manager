<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centrale</title>
    <link rel="stylesheet" href="../../../style.css">
    <script src="../../modules/config/globals.js"></script>
    <style>
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .toolbar .button {
            padding: 6px 14px;
            font-size: 0.82rem;
        }
        .td-actions {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .td-actions .btn-view {
            padding: 4px 10px;
            font-size: 0.78rem;
        }
        .td-actions .btn-export-json,
        .td-actions .btn-export-csv {
            background: none;
            border: 1px solid #333;
            border-radius: 3px;
            padding: 4px 6px;
            cursor: pointer;
            color: #888;
            line-height: 0;
        }
        .td-actions .btn-export-json:hover,
        .td-actions .btn-export-csv:hover {
            color: var(--green);
            border-color: var(--green);
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <div id="main-navbar"></div>

        <div class="toolbar">
            <button class="button secondary" id="btn-import">Import</button>
            <button class="button secondary" id="btn-export-all-json">Export JSON</button>
            <button class="button secondary" id="btn-export-all-csv">Export CSV</button>
        </div>

        <div class="filter-bar">
            <div class="field">
                <label for="filter-name">Caută după nume</label>
                <input type="text" id="filter-name" placeholder="ex. Solar Plant..." autocomplete="off" />
            </div>
            <div class="field">
                <label for="filter-country">Caută după țară</label>
                <input type="text" id="filter-country" placeholder="ex. Romania..." autocomplete="off" />
            </div>
            <button class="btn-reset" id="btn-reset">✕ Resetează</button>
        </div>

        <div class="results-meta">
            <div>Rezultate: <span id="results-count">—</span></div>
        </div>

        <div class="table-shell">
            <table>
                <thead>
                    <tr>
                        <th data-col="name">Nume <span class="sort-icon">↕</span></th>
                        <th data-col="country">Țară <span class="sort-icon">↕</span></th>
                        <th data-col="id">ID <span class="sort-icon">↕</span></th>
                        <th data-col="coords">Coordonate</th>
                        <th data-col="status">Status <span class="sort-icon">↕</span></th>
                        <th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="plants-tbody">
                    <tr class="state-row">
                        <td colspan="7">
                            <span class="spinner-inline"></span> Se încarcă centralele...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <script type = "module" src = "../../modules/pages/power-plants/list.js"></script>
    <script type = "module" src = "../../modules/ui/navbar.js"></script>
</body>
</html>
