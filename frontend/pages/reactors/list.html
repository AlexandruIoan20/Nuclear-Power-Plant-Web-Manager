<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reactoare</title>
    <link rel="stylesheet" href="../../css/base.css">
    <link rel="stylesheet" href="../../css/navbar.css">
    <link rel="stylesheet" href="../../css/layout.css">
    <link rel="stylesheet" href="../../css/buttons.css">
    <link rel="stylesheet" href="../../css/responsive.css">
    <link rel="stylesheet" href="../../css/tables.css">
    <link rel="stylesheet" href="../../css/tags.css">
    <script src="../../modules/config/globals.js"></script>
</head>
<body>
    <div class="page-shell">
        <div id="main-navbar"></div>

        <div class="topbar" style="margin-bottom:16px;">
            <div class="brand">
                <strong>Reactoare</strong>
            </div>
            <div class="nav-links">
                <button class="button" id="btn-create-reactor">Adaugă Reactor</button>
                <button class="button secondary" id="btn-back-plant">Înapoi la Centrală</button>
            </div>
        </div>

        <div class="results-meta" style="margin-bottom: 16px;">
            <div>Total reactoare: <span id="results-count">—</span></div>
        </div>

        <div class="table-shell">
            <table>
                <thead>
                    <tr>
                        <th>Cod Reactor</th>
                        <th>Tip</th>
                        <th>Răcire</th>
                        <th>Status Operațional</th>
                        <th>Putere Termică</th>
                        <th>Putere Electrică</th>
                        <th>Acțiuni</th>
                    </tr>
                </thead>
                <tbody id="reactors-tbody">
                    <tr class="state-row">
                        <td colspan="7">
                            <span class="spinner-inline"></span> Se încarcă reactoarele...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="../../modules/pages/reactors/list.js"></script>
    <script type="module" src="../../modules/ui/navbar.js"></script>
</body>
</html>
