<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Register</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../modules/config/globals.js"></script>
</head>
<body>
    <script>
        if (window.location.hostname === '127.0.0.1') {
            window.location.replace(FRONTEND_BASE + window.location.pathname.replace(/\/register\.html$/, '/register.html'));
        }
    </script>
    <script>
        (async () => {
            try {
                const res = await fetch(API_BASE + '/user/status', { credentials: 'include' });
                if (res.ok) {
                    window.location.replace(FRONTEND_BASE + '/pages/dashboard.html');
                }
            } catch (_) {}
        })();
    </script>
    <div id="main-navbar"></div>
    <div class="page-shell login-layout">
        <section class="login-card" aria-labelledby="register-title">
            <p class="eyebrow">CREATE ACCOUNT</p>
            <h1 id="register-title">Creare cont operator</h1>
            <p>Creează un cont nou pentru a accesa sistemul de monitorizare al centralelor nucleare.</p>

            <div id="register-message" class="footer-note" aria-live="polite"></div>

            <form class="field-grid" id="registerForm" method="post">
                <div class="field">
                    <label for="first_name">Prenume</label>
                    <input id="first_name" name="first_name" type="text" placeholder="Ion" autocomplete="given-name" required>
                </div>
                <div class="field">
                    <label for="last_name">Nume</label>
                    <input id="last_name" name="last_name" type="text" placeholder="Popescu" autocomplete="family-name" required>
                </div>
                <div class="field">
                    <label for="username">Nume de utilizator</label>
                    <input id="username" name="username" type="text" placeholder="ion.popescu" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" placeholder="ion.popescu@nuclear.ro" autocomplete="email" required>
                </div>
                <div class="field">
                    <label for="password">Parolă</label>
                    <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" required>
                </div>
                <div class="field">
                    <label for="password_confirm">Confirmă parolă</label>
                    <input id="password_confirm" name="password_confirm" type="password" placeholder="••••••••" autocomplete="new-password" required>
                </div>
                <div class="button-row">
                    <input type="submit" value="Creare cont">
                    <a class="button secondary" href="login.html">Ai deja cont?</a>
                </div>
            </form>
        </section>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;
            const message = document.getElementById('register-message');

            if (password !== passwordConfirm) {
                message.textContent = 'Parolele nu se potrivesc.';
                return;
            }

            try {
                const response = await fetch(BACKEND_BASE + '/register', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'X-Requested-With': 'fetch',
                        'X-CSRF-Token': await getCsrfToken()
                    },
                    body: new FormData(event.target),
                    credentials: 'include',
                });

                const payload = await response.json();

                if (response.ok && payload.redirect) {
                    window.location.href = payload.redirect;
                    return;
                }

                message.textContent = payload.message || 'Contul nu a putut fi creat.';
            } catch (error) {
                console.error('Eroare la înregistrare:', error);
                message.textContent = 'Eroare la conectare.';
            }
        });
    </script>

    <script type="module" src="../modules/ui/navbar.js"></script>
</body>
</html>
