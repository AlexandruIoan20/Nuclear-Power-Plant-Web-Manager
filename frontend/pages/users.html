<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Users</title>
    <link rel="stylesheet" href="../style.css">
    <script src="../modules/config/globals.js"></script>
</head>
<body>
    <div class="page-shell">
        <div id="app-container" class="panel">
            <p class="inline-status">Se încarcă lista utilizatorilor...</p>
        </div>
    </div>

    <script>
        function escapeHtml(value) {
            return String(value).replace(/[&<>"]|'/g, (character) => {
                const escapeMap = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                };

                return escapeMap[character] || character;
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('app-container');

            fetch(API_BASE + '/users', { credentials: 'include' })
                .then((response) => {
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    return response.json();
                })
                .then((result) => {
                    if (!result.data || result.data.length === 0) {
                        container.innerHTML = '<p class="empty-state">Nu există utilizatori înregistrați.</p>';
                        return;
                    }

                    const rows = result.data.map((user) => `
                        <tr>
                            <td>${escapeHtml(user.id)}</td>
                            <td>${escapeHtml(user.username)}</td>
                            <td>${escapeHtml(user.email)}</td>
                        </tr>
                    `).join('');

                    container.innerHTML = `
                        <header class="topbar">
                            <div class="brand">
                                <strong>Nuclear Plant Control</strong>
                                <span>Utilizatori înregistrați</span>
                            </div>
                            <nav class="nav-links">
                                <a href="dashboard.html">Dashboard</a>
                                <a href="start.html">Start</a>
                            </nav>
                        </header>

                        <h1>Registered Users</h1>
                        <div class="table-shell">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    `;
                })
                .catch((error) => {
                    container.innerHTML = `<p style="color: var(--danger);">Nu am putut încărca utilizatorii: ${escapeHtml(error.message)}</p>`;
                });
        });
    </script>
</body>
</html>
