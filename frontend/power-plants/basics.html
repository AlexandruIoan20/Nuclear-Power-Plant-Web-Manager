<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Basics</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <div class="page-shell narrow">
        <header class="topbar">
            <div class="brand">
                <strong>Nuclear Plant Control</strong>
                <span>Date de bază pentru centrală</span>
            </div>
            <nav class="nav-links">
                <a href="../dashboard.html">Dashboard</a>
                <a href="list.html">Lista</a>
                <a href="create.html">Create</a>
                <a href="basics.html" class="active">Basics</a>
                <a href="update.html">Update</a>
            </nav>
        </header>

        <main class="form-panel login-card">
            <p class="eyebrow">BASIC DATA</p>
            <h1>Date de bază pentru centrală</h1>
            <p>Formularul folosește fetch pentru a trimite date către backend.</p>

            <form id="basic-form" class="field-grid">
                <div class="grid-2">
                    <div class="field">
                        <label for="capacity">Capacitate planificată (MW)</label>
                        <input type="number" id="capacity" name="capacity" step="0.01" placeholder="1200.00">
                    </div>
                    <div class="field">
                        <label for="constructionDurationYears">Durata construcției (ani)</label>
                        <input type="number" id="constructionDurationYears" name="constructionDurationYears" step="1"
                            placeholder="6">
                    </div>
                </div>

                <div class="field">
                    <label for="description">Descriere</label>
                    <textarea id="description" name="description" rows="5"
                        placeholder="Detalii generale despre centrală..."></textarea>
                </div>

                <div class="button-row">
                    <input type="submit" value="Salvează">
                    <a class="button secondary" href="geological.html">Date geologice</a>
                </div>
            </form>

            <div id="status-message" class="footer-note"></div>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const plantId = params.get('id') || 'demo-plant';
        const isUpdate = params.get('mode') === 'update';

        document.getElementById('nav-basics').href = `basics.html?id=${plantId}`;
        document.getElementById('nav-geological').href = `geological.html?id=${plantId}`;
        document.getElementById('nav-technical').href = `technical.html?id=${plantId}`;

        document.querySelector('#basic-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = {
                capacity: document.getElementById('capacity').value,
                constructionDurationYears: document.getElementById('constructionDurationYears').value,
                description: document.getElementById('description').value,
            };

            const endpoint = isUpdate
                ? `http://localhost:8081/api/power-plants/${plantId}/basic-update`
                : `http://localhost:8081/api/power-plants/${plantId}/basic-save`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                document.getElementById('status-message').innerHTML = '<span class="inline-status">Date salvate cu succes.</span>';
            } catch (error) {
                document.getElementById('status-message').innerHTML = `<span style="color: var(--danger);">Eroare: ${error.message}</span>`;
            }
        });
    </script>
</body>

</html>
