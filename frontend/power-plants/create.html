<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalii Centrală Electrică</title>
    <link rel="stylesheet" href="../style.css"> 
</head>
<body>
    <div class="page-shell">
        <main class="form-panel login-card" style="margin: 0 auto;">
            <h1>Detalii Centrală Electrică</h1>
            <p>Introduceți datele pentru noua facilitate energetică în sistemul central.</p>

            <form id="plant-form">
                <div class="field-grid">
                    <div class="field">
                        <label for="name">Nume:</label>
                        <input type="text" id="name" name="name" required />
                    </div> 

                    <div class="field">
                        <label for="country">Țară:</label>
                        <input type="text" id="country" name="country" list="country-list" placeholder="Tastează pentru a căuta..." required />
                        <datalist id="country-list">

                        </datalist>
                    </div>

                    <div class="field">
                        <label for="latitude">Latitudine:</label>
                        <input type="number" id="latitude" name="latitude" step="0.01" min="-90" max="90" required />
                    </div>

                    <div class="field">
                        <label for="longitude">Longitudine:</label>
                        <input type="number" id="longitude" name="longitude" step="0.01" min="-180" max="180" required />
                    </div>
                </div>

                <div class="card-actions">
                    <button type="submit" class="button">Salvează</button>
                </div>
                
                <div id="status-message" style="margin-top: 18px;"></div>
            </form>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const countryList = document.getElementById("country-list");
            const plantForm = document.getElementById("plant-form");
            const statusMessage = document.getElementById("status-message");

            fetch("http://localhost:8081/api/countries") 
                .then(response => {
                    if (!response.ok) throw new Error("Eroare la preluarea listei de țări.");
                    return response.json(); 
                })
                .then(countries => {
                    countries.forEach(country => {
                        const option = document.createElement("option");
                        option.value = country;
                        countryList.appendChild(option);
                    });
                })
                .catch(error => {
                    console.error("Nu s-au putut încărca țările:", error);
                });

            plantForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                
                statusMessage.innerHTML = "";
                
                const payload = {
                    name: document.getElementById("name").value,
                    country: document.getElementById("country").value,
                    latitude: parseFloat(document.getElementById("latitude").value),
                    longitude: parseFloat(document.getElementById("longitude").value)
                };

                try {
                    const response = await fetch("http://localhost:8081/api/power-plants/create", { 
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json(); 

                    if (response.ok) {
                        statusMessage.innerHTML = `<span class="inline-status">Datele au fost salvate cu succes!</span>`;
                        plantForm.reset(); 
                    } else {
                        statusMessage.innerHTML = `<span style="color: var(--danger); font-size: 0.9rem;">${data.message || 'Eroare la salvare.'}</span>`;
                    }
                } catch (error) {
                    console.error("Eroare de rețea:", error);
                    statusMessage.innerHTML = `<span style="color: var(--danger); font-size: 0.9rem;">Eroare critică: Conexiune eșuată cu serverul.</span>`;
                }
            });
        });
    </script>
</body>
</html>
