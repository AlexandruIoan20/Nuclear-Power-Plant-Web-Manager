<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Geological</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page-shell narrow">
        <header class="topbar">
            <div class="brand">
                <strong>Nuclear Plant Control</strong>
                <span>Date geologice și de mediu</span>
            </div>
            <nav class="nav-links">
                <a href="../dashboard.html">Dashboard</a>
                <a href="list.html">Lista</a>
                <a href="basics.html" id="nav-basics">Basics</a>
                <a href="geological.html" id="nav-geological" class="active">Geological</a>
                <a href="technical.html" id="nav-technical">Technical</a>
            </nav>
        </header>

        <main class="form-panel login-card">
            <p class="eyebrow">GEOLOGICAL DATA</p>
            <h1>Date geologice pentru centrală</h1>
            <p>Parametri calculați automat pe backend în momentul salvării.</p>

            <form id="geo-form" class="field-grid">
                <div class="grid-2">
                    <div class="field">
                        <label for="soil_type">Tip sol</label>
                        <select id="soil_type" name="soil_type">
                            <option value="">Selectează</option>
                            <option value="BEDROCK">BEDROCK</option>
                            <option value="STIFF_CLAY">STIFF_CLAY</option>
                            <option value="DENSE_SAND">DENSE_SAND</option>
                            <option value="GRAVEL">GRAVEL</option>
                            <option value="SHALE">SHALE</option>
                            <option value="LIMESTONE">LIMESTONE</option>
                            <option value="SANDSTONE">SANDSTONE</option>
                            <option value="SOFT_CLAY">SOFT_CLAY</option>
                            <option value="LOOSE_SAND">LOOSE_SAND</option>
                            <option value="SILT">SILT</option>
                            <option value="LOAM">LOAM</option>
                            <option value="PEAT">PEAT</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="water_source_type">Sursă apă</label>
                        <select id="water_source_type" name="water_source_type">
                            <option value="">Selectează</option>
                            <option value="FRESH_WATER">FRESH_WATER</option>
                            <option value="SALT_WATER">SALT_WATER</option>
                            <option value="BRACKISH_WATER">BRACKISH_WATER</option>
                        </select>
                    </div>
                </div>

                <div class="grid-3">
                    <div class="field"><label for="seismic_stability">Stabilitate seismică</label><input type="number" id="seismic_stability" name="seismic_stability" step="0.01"></div>
                    <div class="field"><label for="flood_risk">Risc inundație (%)</label><input type="number" id="flood_risk" name="flood_risk" step="0.01"></div>
                    <div class="field"><label for="groundwater_level">Nivel apă freatică</label><input type="number" id="groundwater_level" name="groundwater_level" step="0.1"></div>
                    <div class="field"><label for="water_proximity">Apropiere apă (km)</label><input type="number" id="water_proximity" name="water_proximity" step="0.1"></div>
                    <div class="field"><label for="water_flow_rate">Debit apă</label><input type="number" id="water_flow_rate" name="water_flow_rate" step="0.1"></div>
                    <div class="field"><label for="population_density">Densitate populație</label><input type="number" id="population_density" name="population_density" step="0.1"></div>
                    <div class="field"><label for="transport_infrastructure_score">Infrastructură</label><input type="number" id="transport_infrastructure_score" name="transport_infrastructure_score" step="0.01"></div>
                    <div class="field"><label for="geological_risk_score">Scor risc</label><input type="number" id="geological_risk_score" name="geological_risk_score" step="0.01"></div>
                </div>

                <div class="button-row">
                    <input type="submit" value="Salvează Modificări Manuale">
                </div>
            </form>

            <div id="status-message" class="footer-note" style="margin-top: 15px;"></div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            const plantId = params.get('id');
            const statusMessage = document.getElementById('status-message');

            if (!plantId) {
                statusMessage.innerHTML = `<span style="color: var(--danger);">Eroare: Lipsă ID centrală în URL.</span>`;
                return;
            }

         
            document.getElementById('nav-basics').href = `basics.html?id=${plantId}`;
            document.getElementById('nav-geological').href = `geological.html?id=${plantId}`;
            document.getElementById('nav-technical').href = `technical.html?id=${plantId}`;

         
            const mapHtmlToDto = {
                'soil_type': 'soilType',
                'water_source_type': 'waterSourceType',
                'seismic_stability': 'seismicStability',
                'flood_risk': 'floodRisk',
                'groundwater_level': 'groundwaterLevel',
                'water_proximity': 'waterProximity',
                'water_flow_rate': 'waterFlowRate',
                'population_density': 'populationDensity',
                'transport_infrastructure_score': 'transportInfrastructureScore',
                'geological_risk_score': 'geologicalRiskScore'
            };

          
            try {
                const response = await fetch(`http://localhost:8081/api/power-plants/${plantId}/geological`);
                if (response.ok) {
                    const result = await response.json();
                    
          
                    const geoData = result.data;

                    if (geoData) {
                        Object.keys(mapHtmlToDto).forEach(htmlId => {
                            const dtoKey = mapHtmlToDto[htmlId];
                            const input = document.getElementById(htmlId);
                            
                            if (input && geoData[dtoKey] !== undefined && geoData[dtoKey] !== null) {
                                input.value = geoData[dtoKey];
                            }
                        });
                        statusMessage.innerHTML = '<span class="inline-status">Datele calculate automat au fost încărcate.</span>';
                    }
                }
            } catch (error) {
                console.warn("Nu s-au putut încărca datele inițiale:", error);
            }

           
            document.querySelector('#geo-form').addEventListener('submit', async (event) => {
                event.preventDefault();
                const formData = new FormData(event.target);
                const payload = {};

                Object.keys(mapHtmlToDto).forEach(htmlId => {
                    const dtoKey = mapHtmlToDto[htmlId];
                    const rawValue = formData.get(htmlId);
                    if (rawValue === "" || rawValue === null) {
                        payload[dtoKey] = null;
                    } else if (!isNaN(rawValue) && htmlId !== 'soil_type' && htmlId !== 'water_source_type') {
                        payload[dtoKey] = parseFloat(rawValue);
                    } else {
                        payload[dtoKey] = rawValue;
                    }
                });

                try {
                    const response = await fetch(`http://localhost:8081/api/power-plants/${plantId}/geological`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    statusMessage.innerHTML = '<span class="inline-status">Date geologice salvate cu succes.</span>';
                } catch (error) {
                    statusMessage.innerHTML = `<span style="color: var(--danger);">Eroare la salvare: ${error.message}</span>`;
                }
            });
        });
    </script>
</body>
</html>
