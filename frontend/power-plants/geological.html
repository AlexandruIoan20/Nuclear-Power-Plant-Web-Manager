<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Geological</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page-shell narrow">
        <header class="topbar">
            <div class="brand">
                <strong>Nuclear Plant Control</strong>
                <span>Date geologice și de mediu</span>
            </div>
            <nav class="nav-links">
                <a href="../dashboard.html">Dashboard</a>
                <a href="list.html">Lista</a>
                <a href="basics.html">Basics</a>
                <a href="geological.html" class="active">Geological</a>
                <a href="technical.html">Technical</a>
            </nav>
        </header>

        <main class="form-panel login-card">
            <p class="eyebrow">GEOLOGICAL DATA</p>
            <h1>Date geologice pentru centrală</h1>
            <p>Parametri de sol, apă și risc, salvați prin fetch în backend.</p>

            <form id="geo-form" class="field-grid">
                <div class="grid-2">
                    <div class="field">
                        <label for="soil_type">Tip sol</label>
                        <select id="soil_type" name="soil_type">
                            <option value="">Selectează</option>
                            <option value="SAND">SAND</option>
                            <option value="CLAY">CLAY</option>
                            <option value="ROCK">ROCK</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="water_source_type">Sursă apă</label>
                        <select id="water_source_type" name="water_source_type">
                            <option value="">Selectează</option>
                            <option value="RIVER">RIVER</option>
                            <option value="LAKE">LAKE</option>
                            <option value="SEA">SEA</option>
                        </select>
                    </div>
                </div>

                <div class="grid-3">
                    <div class="field"><label for="seismic_stability">Stabilitate seismică</label><input type="number" id="seismic_stability" step="0.01" min="0" max="1"></div>
                    <div class="field"><label for="flood_risk">Risc inundație</label><input type="number" id="flood_risk" step="0.01" min="0" max="1"></div>
                    <div class="field"><label for="groundwater_level">Nivel apă freatică</label><input type="number" id="groundwater_level" step="0.1"></div>
                    <div class="field"><label for="water_proximity">Apropiere apă (km)</label><input type="number" id="water_proximity" step="0.1"></div>
                    <div class="field"><label for="water_flow_rate">Debit apă</label><input type="number" id="water_flow_rate" step="0.1"></div>
                    <div class="field"><label for="population_density">Densitate populație</label><input type="number" id="population_density" step="0.1"></div>
                    <div class="field"><label for="transport_infrastructure_score">Infrastructură</label><input type="number" id="transport_infrastructure_score" step="0.01" min="0" max="1"></div>
                    <div class="field"><label for="geological_risk_score">Scor risc</label><input type="number" id="geological_risk_score" step="1" min="0" max="100"></div>
                </div>

                <div class="button-row">
                    <input type="submit" value="Salvează">
                    <a class="button secondary" href="technical.html">Date tehnice</a>
                </div>
            </form>

            <div id="status-message" class="footer-note"></div>
        </main>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const plantId = params.get('id') || 'demo-plant';
        const isUpdate = params.get('mode') === 'update';

        document.querySelector('#geo-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const payload = Object.fromEntries(new FormData(event.target).entries());
            const endpoint = isUpdate
                ? `http://localhost:8081/api/power-plants/${plantId}/geological-update`
                : `http://localhost:8081/api/power-plants/${plantId}/geological-save`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                document.getElementById('status-message').innerHTML = '<span class="inline-status">Date geologice salvate.</span>';
            } catch (error) {
                document.getElementById('status-message').innerHTML = `<span style="color: var(--danger);">Eroare: ${error.message}</span>`;
            }
        });
    </script>
</body>
</html>
