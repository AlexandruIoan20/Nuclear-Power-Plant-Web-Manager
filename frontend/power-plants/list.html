<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Centralelor</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <strong>Sistem Centralizat</strong>
                <span>Registrul facilităților energetice</span>
            </div>
            <div class="nav-links">
                <a href="create.html" class="button">Adaugă Centrală</a>
            </div>
        </header>

        <main class="panel">
            <h1>Lista Centralelor Electrice</h1>
            <p>Monitorizarea și gestionarea tuturor unităților înregistrate în baza de date.</p>

            <div id="loading-indicator" class="inline-status" style="margin-bottom: 20px;">
                Se interoghează baza de date...
            </div>
            <div id="error-message" style="color: var(--danger); display: none; margin-bottom: 20px;"></div>

            <div id="plants-container" class="field-grid"></div>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const container = document.getElementById("plants-container");
            const loadingIndicator = document.getElementById("loading-indicator");
            const errorMessage = document.getElementById("error-message");

            try {
                const response = await fetch("http://localhost:8081/api/power-plants/list");
                
                if (!response.ok) {
                    throw new Error(`Eroare de server: HTTP ${response.status}`);
                }

                const result = await response.json();

                console.log("DEBUG: ", result); 
                
                loadingIndicator.style.display = "none";

                if (result.status === "success" && result.data && result.data.length > 0) {
                    result.data.forEach(plant => {
                        const card = document.createElement("div");
                        card.className = "status-card"; 
                        card.style.display = "flex";
                        card.style.justifyContent = "space-between";
                        card.style.alignItems = "center";
                        card.style.padding = "20px";

                        card.innerHTML = `
                            <div>
                                <p style="margin-bottom: 8px; font-size: 1.1rem; color: var(--green);">
                                    <span class="field-hint" style="font-size: 0.8rem; text-transform: uppercase;">Nume:</span> 
                                    <strong>${plant.name || 'Necunoscut'}</strong>
                                </p>
                                <p style="margin: 0; color: var(--text);">
                                    <span class="field-hint" style="font-size: 0.8rem; text-transform: uppercase;">Țară:</span> 
                                    ${plant.country || 'Nespecificată'}
                                </p>
                            </div>
                            <div>
                                <a href="edit.html?id=${plant.id}" class="button secondary" style="text-decoration: none;">
                                    Editează
                                </a>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                } else {
                    container.innerHTML = `<p style="color: var(--muted);">Nu există nicio centrală electrică înregistrată în sistem.</p>`;
                }
            } catch (error) {
                loadingIndicator.style.display = "none";
                errorMessage.style.display = "block";
                errorMessage.innerHTML = `<strong>Eroare critică:</strong> Nu s-au putut prelua datele de la server. Verificați conexiunea.`;
                console.error("Eroare la preluarea listei:", error);
            }
        });
    </script>
</body>
</html>
