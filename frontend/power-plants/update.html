<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editare Detalii Centrală</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <div class="brand">
                <strong>Sistem Centralizat</strong>
                <span>Modificare facilitate energetică</span>
            </div>
            <div class="nav-links">
                <a href="list.html" class="button secondary">Înapoi la Listă</a>
            </div>
        </header>

        <main class="form-panel login-card" style="margin: 0 auto;">
            <h1 id="form-title">Se încarcă datele...</h1>
            <p>Actualizați informațiile generale pentru această facilitate energetică.</p>

            <div id="loading-indicator" class="inline-status" style="margin-bottom: 20px;">
                Se interoghează baza de date...
            </div>
            <div id="status-message" style="margin-bottom: 18px;"></div>

            <form id="plant-edit-form" style="display: none;">
                <div class="field-grid">
                    <div class="field">
                        <label for="name">Nume:</label>
                        <input type="text" id="name" name="name" required />
                    </div> 

                    <div class="field">
                        <label for="country">Țară:</label>
                        <input type="text" id="country" name="country" list="country-list" placeholder="Tastează pentru a căuta..." required />
                        <datalist id="country-list"></datalist>
                    </div>

                    <div class="field">
                        <label for="latitude">Latitudine:</label>
                        <input type="number" id="latitude" name="latitude" step="0.01" min="-90" max="90" required />
                    </div>

                    <div class="field">
                        <label for="longitude">Longitudine:</label>
                        <input type="number" id="longitude" name="longitude" step="0.01" min="-180" max="180" required />
                    </div>
                </div>

                <div class="card-actions" style="justify-content: space-between; margin-top: 32px; border-top: 1px solid var(--border); padding-top: 18px;">
                    <button type="submit" class="button" id="save-btn">Salvează Modificările</button>
                    
                    <a href="#" id="next-step-link" class="button secondary" style="display: none;">
                        Următorul Pas ->
                    </a>
                </div>
            </form>
        </main>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const plantId = urlParams.get('id');
            
            const formTitle = document.getElementById("form-title");
            const loadingIndicator = document.getElementById("loading-indicator");
            const statusMessage = document.getElementById("status-message");
            const form = document.getElementById("plant-edit-form");
            const countryList = document.getElementById("country-list");
            const nextStepLink = document.getElementById("next-step-link");

            if (!plantId) {
                loadingIndicator.style.display = "none";
                statusMessage.innerHTML = `<span style="color: var(--danger);">Eroare: Niciun ID de centrală nu a fost furnizat în URL.</span>`;
                return;
            }

            try {
                const countriesRes = await fetch("http://localhost:8081/api/countries");
                if (countriesRes.ok) {
                    const countries = await countriesRes.json();
                    countries.forEach(country => {
                        const option = document.createElement("option");
                        option.value = country;
                        countryList.appendChild(option);
                    });
                }
            } catch (error) {
                console.error("Avertisment: Nu s-au putut încărca țările.", error);
            }

            try {
                const plantRes = await fetch(`http://localhost:8081/api/power-plants/${plantId}/details`);
                
                if (!plantRes.ok) throw new Error("Nu s-au putut prelua detaliile.");
                
                const result = await plantRes.json();
                
                if (result.status === "success" && result.data) {
                    const plant = result.data;

                    console.log({ plant }); 
                    
                    // Populăm formularul
                    document.getElementById("name").value = plant.name || "";
                    document.getElementById("country").value = plant.country || "";
                    document.getElementById("latitude").value = plant.latitude || "";
                    document.getElementById("longitude").value = plant.longitude || "";
                    
                    // Actualizăm UI-ul
                    formTitle.innerText = `Editare: ${plant.name || 'Centrală'}`;
                    loadingIndicator.style.display = "none";
                    form.style.display = "block";
                    
                    // Setăm link-ul pentru pasul următor (spre basics.html)
                    nextStepLink.href = `basics.html?id=${plantId}`;
                    nextStepLink.style.display = "inline-flex";
                } else {
                    throw new Error(result.message || "Date invalide de la server.");
                }
            } catch (error) {
                loadingIndicator.style.display = "none";
                statusMessage.innerHTML = `<span style="color: var(--danger);">Eroare la încărcarea datelor: ${error.message}</span>`;
            }

            // 3. Procesăm trimiterea formularului
            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                statusMessage.innerHTML = `<span style="color: var(--muted);">Se salvează...</span>`;
                
                const payload = {
                    name: document.getElementById("name").value,
                    country: document.getElementById("country").value,
                    latitude: parseFloat(document.getElementById("latitude").value),
                    longitude: parseFloat(document.getElementById("longitude").value)
                };

                try {
                    const updateRes = await fetch(`http://localhost:8081/api/power-plants/${plantId}/details-update`, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(payload)
                    });

                    const updateData = await updateRes.json();

                    if (updateRes.ok && updateData.status === "success") {
                        statusMessage.innerHTML = `<span class="inline-status">Modificările au fost salvate cu succes!</span>`;
                        formTitle.innerText = `Editare: ${payload.name}`; // Actualizăm titlul vizual
                    } else {
                        statusMessage.innerHTML = `<span style="color: var(--danger);">${updateData.message || 'Eroare la salvare.'}</span>`;
                    }
                } catch (error) {
                    console.error("Eroare de rețea la salvare:", error);
                    statusMessage.innerHTML = `<span style="color: var(--danger);">Eroare critică de comunicare cu serverul.</span>`;
                }
            });
        });
    </script>
</body>
</html>
