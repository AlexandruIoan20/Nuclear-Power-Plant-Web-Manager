<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuclear Plant Control | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container"></div>

    <script>
        const container = document.getElementById('container');

        fetch("http://localhost:8081/register")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Eroare de server: ${response.status}`);
                }
                return response.text();
            })
            .then(html => {
                container.innerHTML = html;
            })
            .catch(error => {
                console.error("Eroare la încărcarea modulului Register:", error);
                container.innerHTML = "<p style='color: red;'>Eroare critică: Nu s-a putut contacta serverul central.</p>";
            });
    </script>
</body>
</html>
